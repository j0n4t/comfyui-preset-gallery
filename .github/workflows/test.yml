name: test

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v5

      - run: npm ci
      - run: npm run verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-browsers

      # The dev/ harness needs no ComfyUI: Playwright boots dev/serve.py as
      # its webServer. In CI the config enables all three browser projects;
      # comfyui_integration.spec.ts skips itself (no live server in CI).
      - run: npx playwright install --with-deps
      - run: npx playwright test
